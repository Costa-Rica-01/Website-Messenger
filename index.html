
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>App de Correo Electrónico</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.chat-container{
    width:100%;
    max-width:420px;
    background:#ffffff;
    border-radius:25px;
    overflow:hidden;
    box-shadow:0 10px 35px rgba(0,0,0,0.3);
}

.chat-header{
    background:#2563eb;
    color:white;
    padding:18px;
    text-align:center;
}

.chat-header h1{
    font-size:22px;
}

.chat-header p{
    font-size:13px;
    opacity:0.9;
    margin-top:5px;
}

.chat-box{
    height:400px;
    overflow-y:auto;
    padding:15px;
    background:#f1f5f9;
}

.message{
    margin-bottom:15px;
    max-width:80%;
    padding:12px;
    border-radius:15px;
    word-wrap:break-word;
    font-size:15px;
}

.user{
    background:#2563eb;
    color:white;
    margin-left:auto;
    border-bottom-right-radius:5px;
}

.bot{
    background:white;
    color:#111827;
    border-bottom-left-radius:5px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.form-area{
    padding:15px;
    background:white;
    border-top:1px solid #e5e7eb;
}

.input-group{
    margin-bottom:12px;
}

.input-group label{
    display:block;
    margin-bottom:5px;
    font-size:14px;
    color:#374151;
    font-weight:bold;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:12px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input-group textarea{
    resize:none;
    height:90px;
}

.send-btn{
    width:100%;
    padding:14px;
    border:none;
    background:#2563eb;
    color:white;
    font-size:16px;
    border-radius:14px;
    cursor:pointer;
    transition:0.3s;
}

.send-btn:hover{
    background:#1d4ed8;
}

.status{
    text-align:center;
    margin-top:10px;
    font-size:14px;
    color:green;
}

/* RESPONSIVE */

@media(max-width:480px){

    .chat-box{
        height:350px;
    }

    .chat-header h1{
        font-size:20px;
    }

}

</style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        <h1>App de Correo</h1>
        <p>Envía correos usando la aplicación</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            ¡Hola! 👋<br>
            Completa los campos y se abrirá la App de Gmail para que envíes tu mensaje.
        </div>

    </div>

    <div class="form-area">

        <form id="emailForm">

            <div class="input-group">
                <label>Tu Correo</label>
                <input type="email" id="fromEmail" placeholder="tucorreo@gmail.com" required>
            </div>

            <div class="input-group">
                <label>Correo Destino</label>
                <input type="email" id="toEmail" placeholder="destino@gmail.com" required>
            </div>

            <div class="input-group">
                <label>Asunto</label>
                <input type="text" id="subject" placeholder="Asunto del correo" required>
            </div>

            <div class="input-group">
                <label>Mensaje</label>
                <textarea id="message" placeholder="Escribe tu mensaje..." required></textarea>
            </div>

            <button type="submit" class="send-btn">
                Abrir Gmail
            </button>

            <div class="status" id="status"></div>

        </form>

    </div>

</div>

<script>

const form = document.getElementById("emailForm");
const chatBox = document.getElementById("chatBox");
const statusText = document.getElementById("status");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const fromEmail = document.getElementById("fromEmail").value; // Aunque no se usa directamente en la URL, es bueno tenerlo para referencia
    const toEmail = document.getElementById("toEmail").value;
    const subject = document.getElementById("subject").value;
    const message = document.getElementById("message").value;

    // Mostrar mensaje en el chat indicando la acción
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.innerHTML = `Enviando correo a ${toEmail}...`; // Mensaje temporal en el chat

    chatBox.appendChild(userMessage);

    // Preparar la URL para abrir Gmail App con los detalles del correo
    // Se usa encodeURIComponent para asegurar que los caracteres especiales se transmitan correctamente
    const gmailURL = `mailto:${toEmail}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(message)}`;

    // Abrir Gmail App (o el cliente de correo predeterminado del usuario)
    window.open(gmailURL, "_blank");

    // Mensaje de confirmación en el chat
    setTimeout(() => {
        const botMessage = document.createElement("div");
        botMessage.className = "message bot";
        botMessage.innerHTML =
        `Tu mensaje para <b>${toEmail}</b> con el asunto "<b>${subject}</b>" ha sido preparado.<br>
        Revisa tu aplicación de correo para completarlo.`;

        chatBox.appendChild(botMessage);

        // Actualizar el chatBox para mostrar el último mensaje
        chatBox.scrollTop = chatBox.scrollHeight;

    }, 700); // Pequeño retraso para dar tiempo a que la ventana se abra

    // Actualizar el estado
    statusText.innerHTML = "Abriendo Gmail...";

    // Opcional: limpiar el campo de mensaje después de enviar
    document.getElementById("message").value = "";
    document.getElementById("subject").value = "";
    // No limpiamos los correos para que el usuario pueda reenviar fácilmente si lo desea

    // Asegurarse de que el scroll del chatBox esté al final
    chatBox.scrollTop = chatBox.scrollHeight;

});

</script>

</body>
</html>


</div>
